name: CI

# Elke push op elke branch (ook die van Dependabot). De checks gelden per commit,
# dus ook voor de PR met die commit.
on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (met lokale Supabase-URL, alleen ter controle)
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
      - name: CSP in de build controleren
        run: |
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          grep -q 'connect-src http://127.0.0.1:54321' dist/index.html
          if grep -Eq 'unsafe-inline|unsafe-eval' dist/index.html; then echo "::error::CSP bevat unsafe-inline of unsafe-eval"; exit 1; fi
          # Geen inline scripts: elk <script> moet een src hebben.
          if grep -Pq '<script(?![^>]*\bsrc=)[^>]*>' dist/index.html; then echo "::error::Inline script in index.html"; exit 1; fi
      - name: Componentengalerij niet in de build
        run: |
          if grep -rq 'Componentengalerij' dist; then echo "::error::De galerij (alleen development) staat in de build"; exit 1; fi
          if grep -rq 'Demo met fictieve gegevens' dist; then echo "::error::De demomodus (alleen development) staat in de build"; exit 1; fi

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.115.0
      - name: Lokale database starten (migraties en seed)
        run: supabase db start
      - name: pgTAP-tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee pgtap.log
      # Logs zijn alleen zichtbaar voor ingelogde gebruikers; annotaties ook via de API.
      # Bevat uitsluitend synthetische testdata.
      - name: Mislukte tests als annotatie
        if: failure()
        run: |
          regels=$(grep -E '^(not ok|# |psql|ERROR|FATAL|Failed|Dubious|Parse errors|Result|Files=)|Wstat|planned' pgtap.log | head -n 80 || true)
          if [ -z "$regels" ]; then regels=$(tail -n 40 pgtap.log); fi
          bericht=$(printf '%s' "$regels" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=pgTAP-uitvoer::$bericht"

  # Volledige lokale stack (Postgres, Auth, PostgREST, Edge Functions): controleert de
  # gegenereerde databasetypes en draait de end-to-end-test van de inlogstroom.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.115.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Lokale stack starten
        run: supabase start -x studio,imgproxy,storage-api,realtime,logflare,vector,supavisor
      - name: Databasetypes controleren
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -q src/lib/database.types.ts /tmp/database.types.ts > /dev/null; then
            # Annotaties zijn max. 4096 tekens: gecomprimeerd (gzip + base64) in delen.
            # Herstellen: delen achter elkaar, base64 -d | gunzip > src/lib/database.types.ts
            { gzip -9 -c /tmp/database.types.ts | base64 -w0 | fold -w 4000; echo; } > /tmp/delen.txt
            totaal=$(wc -l < /tmp/delen.txt)
            n=0
            while IFS= read -r deel; do
              n=$((n + 1))
              echo "::error title=database.types.ts verouderd (deel ${n}/${totaal})::${deel}"
            done < /tmp/delen.txt
            exit 1
          fi
      - name: End-to-end-test inlogstroom
        working-directory: e2e
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          set -o pipefail
          deno task test 2>&1 | tee e2e.log
      - name: Mislukte e2e-stappen als annotatie
        if: failure()
        working-directory: e2e
        run: |
          [ -f e2e.log ] || exit 0
          regels=$(grep -E 'FAILED|error|Error|=>|assert' e2e.log | head -n 60 || true)
          bericht=$(printf '%s' "$regels" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=e2e-uitvoer::$bericht"

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: fmt, lint, typecheck en tests
        run: deno task check --frozen
      - name: e2e-test controleren (fmt, lint, typecheck, TOTP-unittest)
        working-directory: e2e
        run: deno task check --frozen && deno test --frozen totp.test.ts
